name: recommendation-service

on:
  push:
    branches: [master]
    paths:
      - services/recommendation-service/**
      - k8s/recommendation-service.yaml
      - .github/workflows/recommendation-service.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

# One pipeline per service at a time; a newer push waits instead of cancelling
# a deploy that is already rolling out.
concurrency:
  group: recommendation-service
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/recommendation-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/recommendation-service/requirements.txt
            services/recommendation-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
    with:
      service: recommendation-service
    secrets: inherit
