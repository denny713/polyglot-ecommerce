name: auth-service

on:
  push:
    branches: [master]
    paths:
      - services/auth-service/**
      - k8s/auth-service.yaml
      - .github/workflows/auth-service.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

# One pipeline per service at a time; a newer push waits instead of cancelling
# a deploy that is already rolling out.
concurrency:
  group: auth-service
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/auth-service/pom.xml
      # No QUARKUS_OIDC_AUTH_SERVER_URL here, so Quarkus Dev Services starts a
      # throwaway Keycloak container for the OIDC tests (Docker is on the runner).
      - run: mvn -B test

  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
    with:
      service: auth-service
    secrets: inherit
