name: notification-service

on:
  push:
    branches: [master]
    paths:
      - services/notification-service/**
      - k8s/notification-service.yaml
      - .github/workflows/notification-service.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

# One pipeline per service at a time; a newer push waits instead of cancelling
# a deploy that is already rolling out.
concurrency:
  group: notification-service
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: services/notification-service/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test --ci

  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
    with:
      service: notification-service
    secrets: inherit
