host: localhost:7130
info:
  contact: {}
  description: This is a Product Service API.
  title: Product Service API
  version: "1.0"
paths:
  /api/product:
    get:
      consumes:
      - application/json
      description: Search products by name and description (ILIKE), price range and
        stock range.
      parameters:
      - description: Product name, matched partially
        in: query
        name: name
        type: string
      - description: Product description, matched partially
        in: query
        name: description
        type: string
      - description: Minimum product price
        in: query
        name: min_price
        type: number
      - description: Maximum product price
        in: query
        name: max_price
        type: number
      - description: Minimum stock quantity
        in: query
        name: min_stock
        type: integer
      - description: Maximum stock quantity
        in: query
        name: max_stock
        type: integer
      - description: Sort field
        enum:
        - id
        - name
        - price
        - stock
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - description: Page number, starts at 1
        in: query
        name: page
        type: integer
      - description: Rows per page, max 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/product.ProductSearchRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Search products
      tags:
      - Product
    post:
      consumes:
      - multipart/form-data
      description: Create a new product, the image is uploaded to the object storage.
      parameters:
      - description: Product name
        in: formData
        name: name
        required: true
        type: string
      - description: Product description
        in: formData
        name: description
        type: string
      - description: Product price
        in: formData
        name: price
        required: true
        type: number
      - description: Product image (jpg, jpeg, png, webp, max 5 MB)
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/product.ProductCreateRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create a new product
      tags:
      - Product
  /api/product/{id}:
    get:
      consumes:
      - application/json
      description: Get details of a specific product.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/product.ProductDetailRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Detail a new product
      tags:
      - Product
    put:
      consumes:
      - multipart/form-data
      description: Update an existing product, the image is uploaded to the object
        storage.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Product name
        in: formData
        name: name
        required: true
        type: string
      - description: Product description
        in: formData
        name: description
        type: string
      - description: Product price
        in: formData
        name: price
        required: true
        type: number
      - description: Product image (jpg, jpeg, png, webp, max 5 MB)
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/product.ProductUpdateRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Update an existing product
      tags:
      - Product
  /api/product/activate/{id}:
    put:
      consumes:
      - application/json
      description: Activate a specific product.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/product.ProductActivateRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Activate a product
      tags:
      - Product
  /api/product/deactivate/{id}:
    put:
      consumes:
      - application/json
      description: Deactivate a specific product.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/product.ProductDeactivateRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Deactivate a product
      tags:
      - Product
  /api/product/delete/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a specific product.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/product.ProductDeleteRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Delete a product
      tags:
      - Product
securityDefinitions:
  BearerAuth:
    description: Provide access token with Bearer prefix, e.g. "Bearer {token}".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
