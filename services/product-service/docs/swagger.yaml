basePath: /
definitions:
  dto.Response:
    properties:
      data: {}
      message:
        type: string
      status:
        type: integer
    type: object
  product.ProductCreateRes:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_active:
        type: boolean
      is_deleted:
        type: boolean
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
      updated_at:
        type: string
    type: object
host: localhost:7130
info:
  contact: {}
  description: This is a Product Service API.
  title: Product Service API
  version: "1.0"
paths:
  /api/product:
    post:
      consumes:
      - multipart/form-data
      description: Create a new product, the image is uploaded to the object storage.
      parameters:
      - description: Product name
        in: formData
        name: name
        required: true
        type: string
      - description: Product description
        in: formData
        name: description
        type: string
      - description: Product price
        in: formData
        name: price
        required: true
        type: number
      - description: Product image (jpg, jpeg, png, webp, max 5 MB)
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/product.ProductCreateRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create a new product
      tags:
      - Product
securityDefinitions:
  BearerAuth:
    description: Provide access token with Bearer prefix, e.g. "Bearer {token}".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
