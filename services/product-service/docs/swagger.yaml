paths:
  /api/category:
    get:
      consumes:
      - application/json
      description: Search categories by name and description (ILIKE), price range
        and stock range.
      parameters:
      - description: Category name, matched partially
        in: query
        name: name
        type: string
      - description: Category description, matched partially
        in: query
        name: description
        type: string
      - description: Sort field
        enum:
        - id
        - name
        - description
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - description: Page number, starts at 1
        in: query
        name: page
        type: integer
      - description: Rows per page, max 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/category.CategorySearchRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Search categories
      tags:
      - Category
    post:
      consumes:
      - application/json
      description: Create a new category, the payload is sent as a json body.
      parameters:
      - description: Category payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/category.CategoryCreateReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/category.CategoryCreateRes'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create a new category
      tags:
      - Category
