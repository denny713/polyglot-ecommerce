# Build-time configuration.
#
# Everything that can be changed per environment lives in the .env file (see
# .env.example) or in the container environment — this file is only for
# properties Quarkus fixes while the application is being built, which the
# .env file can no longer influence because Dockerfile.multistage copies
# nothing but pom.xml and src/ into the build stage.

# --- OpenAPI document ---------------------------------------------------------

# Served at http://<host>:<port>/q/openapi (add ?format=json for JSON).
# The document metadata itself — title, version, tags, security schemes — is
# declared in com.ecommerce.auth.configuration.OpenApiConfiguration.
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.store-schema-directory=target/openapi

# Tags and security schemes are declared by hand — @Tag on the controller and
# @SecurityScheme in OpenApiConfiguration. Left on, the first would invent a tag
# from the class name ("Auth Controller"), and the second would add a second,
# generically named openIdConnect scheme just because quarkus-oidc is on the
# classpath, next to the bearerAuth scheme this service actually documents.
quarkus.smallrye-openapi.auto-add-tags=false
quarkus.smallrye-openapi.auto-add-security=false

# --- Swagger UI ---------------------------------------------------------------

# Quarkus only ships Swagger UI in dev and test mode by default. This service
# is an internal API whose /q/* paths are already reachable, so the UI is kept
# in the packaged application too — set this to false for a public-facing
# deployment where the schema should not be browsable.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.title=auth-service API

# Collapse the operation list on load and keep the "Try it out" button enabled,
# so the UI is usable as a manual test client against a running Keycloak.
quarkus.swagger-ui.doc-expansion=list
quarkus.swagger-ui.try-it-out-enabled=true

# --- HTTP access control ------------------------------------------------------

# Which paths need a bearer token. This lives here rather than in .env because
# it is not a credential and not per-environment: it is the security posture of
# the service, and it belongs in version control next to the endpoints it
# protects. Keeping it in an ignored file meant a fresh clone started with no
# path permissions at all — endpoints then answered 403 from AccountAccessGuard
# instead of 401, and the "without a token" tests failed.
#
# The entries are read most-specific-first, so the open paths below stay public
# even though /* demands authentication.
#
# Open: logging in and out have no token to present yet or any more, and /q/* is
# the OpenAPI document and Swagger UI.
quarkus.http.auth.permission.public.paths=/api/auth/*,/q/*
quarkus.http.auth.permission.public.policy=permit

# Registering is how a customer gets a token, so it cannot demand one. It is
# POST /api/account — the same path as the authenticated read, update and delete
# — so this entry is scoped by method rather than by path alone. Widening it to
# the bare path would open the whole account resource.
quarkus.http.auth.permission.register.paths=/api/account
quarkus.http.auth.permission.register.policy=permit
quarkus.http.auth.permission.register.methods=POST

# The other verbs on that same path. Needed explicitly: once a path carries a
# method-scoped permission, a request whose method is not listed anywhere for
# that path is rejected outright with 403 rather than falling through to the
# /* entry below, which is the wrong answer for a caller who simply has no
# token yet.
quarkus.http.auth.permission.account.paths=/api/account
quarkus.http.auth.permission.account.policy=authenticated
quarkus.http.auth.permission.account.methods=GET,PUT,DELETE

# Everything else, which is to say the rest of /api/account. Deliberately /*
# rather than a list, so a new endpoint is protected by default and has to be
# opted out of above rather than remembered into place.
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# --- Notifications -----------------------------------------------------------

# Account events go to the notification service over RabbitMQ. The channel's
# shape is the contract with that service, so it lives here in version control;
# the broker's host and credentials are per environment and come from .env
# (RABBITMQ_HOST, RABBITMQ_PORT, RABBITMQ_USERNAME, RABBITMQ_PASSWORD).
#
# A durable direct exchange: the notification service binds its queue to it
# with the same routing key. Publisher confirms are on because registration
# waits for one before it lets the account stand — see BrokerAccountNotifier.
mp.messaging.outgoing.account-notification.connector=smallrye-rabbitmq
mp.messaging.outgoing.account-notification.exchange.name=notification.exchange
mp.messaging.outgoing.account-notification.exchange.type=direct
mp.messaging.outgoing.account-notification.exchange.durable=true
mp.messaging.outgoing.account-notification.default-routing-key=notification.account
mp.messaging.outgoing.account-notification.publish-confirms=true

# How long registration waits for the broker to confirm the password email.
notification.confirm-timeout=10s

# --- Test-only fallbacks ------------------------------------------------------

# The %test profile is the only runtime configuration in this file, and it is
# here so that `./mvnw test` works on a fresh clone: the required Keycloak
# properties normally come from the .env file, which is deliberately not in
# version control.
#
# These are fallbacks, not overrides — .env is a higher-ordinal config source,
# so a developer who has one keeps their own values. Nothing in the test suite
# reaches Keycloak, so the secret below is a placeholder and not a credential.
%test.keycloak.auth.realm=ecommerce
%test.keycloak.auth.client-id=ecommerce-app
%test.keycloak.admin-api.client-id=auth-service
%test.keycloak.admin-api.client-secret=placeholder-not-a-real-secret
%test.quarkus.rest-client.keycloak-token-api.url=http://localhost:8080

# No broker in the test suite: the channel is swapped for the in-memory
# connector and the RabbitMQ dev service is not started.
%test.mp.messaging.outgoing.account-notification.connector=smallrye-in-memory
%test.quarkus.rabbitmq.devservices.enabled=false
