# Test-only configuration. Production values come from the .env file.

# The jacoco-maven-plugin agent already created the data file before the JVM
# started; without this the Quarkus extension would delete it and the coverage
# collected by the plain JUnit tests would be lost.
quarkus.jacoco.reuse-data-file=true
quarkus.jacoco.data-file=target/jacoco-quarkus.exec
quarkus.jacoco.report-location=target/jacoco-report
quarkus.jacoco.title=auth-service test coverage