# Configuration baked into the Docker image as /app/config/application.yml.
#
# Same keys as the local config/application.yml (gitignored), but every value
# that differs per environment comes from the container environment, which is
# what app/docker-compose.yml sets.
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ecommerce}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Jakarta
          batch_size: 50
        order_inserts: true
        order_updates: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:admin}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
rabbitmq:
  exchange:
    sales: ${RABBITMQ_SALES_EXCHANGE:sales.exchange}
    sales-dlx: ${RABBITMQ_SALES_DLX_EXCHANGE:sales.dlx.exchange}
    notification: ${RABBITMQ_NOTIFICATION_EXCHANGE:notification.exchange}
  queue:
    so-submit: ${RABBITMQ_SO_SUBMIT_QUEUE:inventory.so.submit}
    so-submit-dlq: ${RABBITMQ_SO_SUBMIT_DLQ:inventory.so.submit.dlq}
    so-cancel: ${RABBITMQ_SO_CANCEL_QUEUE:inventory.so.cancel}
    so-cancel-dlq: ${RABBITMQ_SO_CANCEL_DLQ:inventory.so.cancel.dlq}
  routing-key:
    so-submit: ${RABBITMQ_SO_SUBMIT_ROUTING_KEY:sales.order.submitted}
    so-submit-dlq: ${RABBITMQ_SO_SUBMIT_DLQ_ROUTING_KEY:sales.order.submitted.dlq}
    so-cancel: ${RABBITMQ_SO_CANCEL_ROUTING_KEY:sales.order.cancelled}
    so-cancel-dlq: ${RABBITMQ_SO_CANCEL_DLQ_ROUTING_KEY:sales.order.cancelled.dlq}
    notification-order: ${RABBITMQ_NOTIFICATION_ORDER_ROUTING_KEY:notification.order}
    notification-cart: ${RABBITMQ_NOTIFICATION_CART_ROUTING_KEY:notification.cart}
redis:
  cart:
    key-prefix: ${REDIS_CART_KEY_PREFIX:cart}
    ttl: ${REDIS_CART_TTL:7d}
    keyspace-events: ${REDIS_CART_KEYSPACE_EVENTS:Ex}
checkout:
  payment-timeout: ${CHECKOUT_PAYMENT_TIMEOUT:60m}
  expiry-interval: ${CHECKOUT_EXPIRY_INTERVAL:1m}
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/ecommerce}
server:
  port: ${SERVER_PORT:7120}
  servlet:
    context-path: /api
    session:
      timeout: 60m
  error:
    whitelabel:
      enabled: false
    path: /error
logging:
  level:
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss.SSS} %thread ${PID} [%X{correlationId}] %-5level %logger{36} - %class{1} - %msg%n"
