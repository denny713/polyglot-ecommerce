services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p@ssw0rd}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/create-db.sh:/docker-entrypoint-initdb.d/create-db.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - polygot

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - polygot

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-P@ssw0rd}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-p@ssw0rd}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    networks:
      - polygot

  # Catches the registration emails auth-service sends, so a developer can read
  # the generated password without a real mail provider. Nothing it holds
  # survives a restart, which is what we want for throwaway credentials — hence
  # no volume.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - polygot

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: src/main/docker/Dockerfile.multistage
    container_name: auth-service
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_PORT: ${AUTH_SERVICE_PORT:-7110}
      QUARKUS_REST_CLIENT_KEYCLOAK_TOKEN_API_URL: http://keycloak:8080
      KEYCLOAK_AUTH_REALM: ${KEYCLOAK_REALM:-ecommerce}
      KEYCLOAK_AUTH_CLIENT_ID: ${KEYCLOAK_CLIENT:-ecommerce-app}
      KEYCLOAK_AUTH_GRANT_TYPE: password
      # Bearer token validation. /api/account/{accountId} is behind it, so
      # leaving this out would publish an unauthenticated delete-any-account
      # endpoint on the compose network.
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ecommerce}
      QUARKUS_OIDC_CLIENT_ID: ${AUTH_SERVICE_CLIENT_ID:-auth-service}
      QUARKUS_OIDC_CREDENTIALS_SECRET: ${AUTH_SERVICE_CLIENT_SECRET:-}
      QUARKUS_OIDC_APPLICATION_TYPE: service
      QUARKUS_OIDC_TOKEN_AUDIENCE: ${AUTH_SERVICE_CLIENT_ID:-auth-service}
      # Service account for the Keycloak Admin REST API. keycloak-init.sh
      # generates this secret and prints it — put it in app/.env as
      # AUTH_SERVICE_CLIENT_SECRET, or /api/account answers 503.
      KEYCLOAK_ADMIN_API_CLIENT_ID: ${AUTH_SERVICE_CLIENT_ID:-auth-service}
      KEYCLOAK_ADMIN_API_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET:-}
      # Where the password generated at registration is sent. Mock delivery is
      # off here — unlike dev and test mode, a container that only logged the
      # password would hand out accounts nobody can log in to.
      QUARKUS_MAILER_FROM: ${MAILER_FROM:-no-reply@polygot-ecommerce.local}
      QUARKUS_MAILER_MOCK: "false"
      QUARKUS_MAILER_HOST: ${MAILER_HOST:-mailpit}
      QUARKUS_MAILER_PORT: ${MAILER_PORT:-1025}
      # Path permissions are not set here on purpose: they ship with the image,
      # in application.properties, so this file cannot silently disagree with
      # what the code was tested against.
    ports:
      - "${AUTH_SERVICE_PORT:-7110}:${AUTH_SERVICE_PORT:-7110}"
    depends_on:
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/127.0.0.1/${AUTH_SERVICE_PORT:-7110}
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - polygot

volumes:
  postgres-data:
  minio-data:

networks:
  polygot:
    driver: bridge
