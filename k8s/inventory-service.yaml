# Deployed by .github/workflows/inventory-service.yml, which replaces ${IMAGE} with the
# commit's image (ghcr.io/<owner>/<repo>/inventory-service:<sha>). Mirrors the
# inventory-service entry in app/docker-compose.yml; see k8s/README.md for the
# infrastructure and secrets it expects in the namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: inventory-service
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 7140
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "ecommerce"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_VHOST
              value: "/"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://keycloak:8080/realms/ecommerce"
          startupProbe:
            tcpSocket:
                port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
                port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
                port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 7140
      targetPort: http
